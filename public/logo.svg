<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Vibrant Emerald-Cyan Brand Gradient -->
    <linearGradient id="rwBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="rwAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="rwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#rwBg)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#rwBrand)" stroke-width="2" stroke-opacity="0.35" />

  <!-- Outer Wheel Caliper Ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#rwBrand)" stroke-width="4.5" stroke-dasharray="210 20" stroke-linecap="round" />

  <!-- Center Luxury Wheel Hub -->
  <circle cx="64" cy="64" r="14" fill="#060a12" stroke="url(#rwAccent)" stroke-width="3" />
  <circle cx="64" cy="64" r="6" fill="url(#rwBrand)" />

  <!-- Dynamic Aerodynamic Wheel Spokes / Blades (6-Spoke Turbine) -->
  <g stroke="url(#rwBrand)" stroke-width="4.5" stroke-linecap="round">
    <!-- Spoke 1 (Top) -->
    <path d="M 64 50 L 64 22" />
    <!-- Spoke 2 (Top Right) -->
    <path d="M 76 57 L 100 43" />
    <!-- Spoke 3 (Bottom Right) -->
    <path d="M 76 71 L 100 85" />
    <!-- Spoke 4 (Bottom) -->
    <path d="M 64 78 L 64 106" />
    <!-- Spoke 5 (Bottom Left) -->
    <path d="M 52 71 L 28 85" />
    <!-- Spoke 6 (Top Left) -->
    <path d="M 52 57 L 28 43" />
  </g>

  <!-- Speed Arc / Wing Accent (Exotic Supercar Aero Line) -->
  <path d="M 26 64 C 26 40, 46 22, 70 22 C 86 22, 102 32, 106 46" fill="none" stroke="url(#rwAccent)" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#rwGlow)" />
  <path d="M 102 64 C 102 88, 82 106, 58 106 C 42 106, 26 96, 22 82" fill="none" stroke="url(#rwBrand)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
</svg>

